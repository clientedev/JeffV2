<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Microchip design -->
  <g fill="#ffffff">
    <!-- Center square -->
    <rect x="35" y="35" width="30" height="30" rx="2"/>
    
    <!-- Pins left -->
    <rect x="25" y="38" width="8" height="3"/>
    <rect x="25" y="45" width="8" height="3"/>
    <rect x="25" y="52" width="8" height="3"/>
    <rect x="25" y="59" width="8" height="3"/>
    
    <!-- Pins right -->
    <rect x="67" y="38" width="8" height="3"/>
    <rect x="67" y="45" width="8" height="3"/>
    <rect x="67" y="52" width="8" height="3"/>
    <rect x="67" y="59" width="8" height="3"/>
    
    <!-- Pins top -->
    <rect x="38" y="25" width="3" height="8"/>
    <rect x="45" y="25" width="3" height="8"/>
    <rect x="52" y="25" width="3" height="8"/>
    <rect x="59" y="25" width="3" height="8"/>
    
    <!-- Pins bottom -->
    <rect x="38" y="67" width="3" height="8"/>
    <rect x="45" y="67" width="3" height="8"/>
    <rect x="52" y="67" width="3" height="8"/>
    <rect x="59" y="67" width="3" height="8"/>
    
    <!-- Center dot -->
    <circle cx="50" cy="50" r="4" fill="#3b82f6"/>
  </g>
</svg>
